app = "your-app-name"  # এখানে আপনার Fly.io অ্যাপের নাম বসাবেন
primary_region = "sin"  # সিঙ্গাপুর রিজিয়ন (বাংলাদেশ থেকে সবচেয়ে কম ল্যাটেন্সি পাবে)

[build]
  builder = "paketobuildpacks/builder:base"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]
