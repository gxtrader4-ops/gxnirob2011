# fly.toml app configuration file generated for gxnirob2011 on 2026-11-11T07:06:08Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'gxnirob2011'
primary_region = 'sin'

[build]
  builder = 'paketobuildpacks/builder:base'

[processes]
  app = 'python main.py'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
